name: RSS Feed Fetcher

on:
  schedule:
    - cron: '0 * * * *'   # Every hour

  workflow_dispatch:

jobs:
  fetch-rss:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      
      - name: Diagnose spaCy tokenizer
        continue-on-error: true
        run: |
          python -m pip show spacy en-core-web-sm preshed cymem murmurhash

          echo "TEST 1: Preshed map"
          if python -c "from preshed.maps import PreshMap; m = PreshMap(); print('Initialized'); m[123] = 456; print('Stored value:', m[123])"; then
            echo "PRESHED TEST: PASS"
          else
            echo "PRESHED TEST: FAIL"
          fi

          echo "TEST 2: Basic spaCy tokenizer"
          if python -c "import spacy; print('spaCy:', spacy.__version__); nlp = spacy.blank('en'); print('Basic tokenizer works'); print([t.text for t in nlp('Virat Kohli plays cricket in India')])"; then
            echo "BLANK TOKENIZER TEST: PASS"
          else
            echo "BLANK TOKENIZER TEST: FAIL"
          fi

          echo "TEST 3: English model"
          if python -c "import spacy; nlp = spacy.load('en_core_web_sm'); print('English model loaded'); print([(e.text, e.label_) for e in nlp('Virat Kohli plays cricket in India').ents])"; then
            echo "ENGLISH MODEL TEST: PASS"
          else
            echo "ENGLISH MODEL TEST: FAIL"
          fi


      - name: Run RSS Fetcher
        run: python fetch_rss.py

      - name: Run Google Trends
        run: python fetch_google_trends.py
