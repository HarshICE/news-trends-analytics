name: RSS Feed Fetcher

on:
  schedule:
    - cron: '0 * * * *'   # Every hour

  workflow_dispatch:

jobs:
  fetch-rss:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      
      - name: Diagnose spaCy dependencies
        run: |
          python -m pip show preshed cymem murmurhash
          echo "TEST 1: Preshed map"
          python -c "from preshed.maps import PreshMap; m = PreshMap(); print('PreshMap initialized'); print('Empty map:', list(m)); m.set(123, 'test'); print('Stored value:', m.get(123))"
          echo "TEST 2: spaCy tokenizer"
          python -c "import spacy; print('spaCy:', spacy.__version__); nlp = spacy.blank('en'); print('Basic tokenizer works')"

      - name: Run RSS Fetcher
        run: python fetch_rss.py

      - name: Run Google Trends
        run: python fetch_google_trends.py
