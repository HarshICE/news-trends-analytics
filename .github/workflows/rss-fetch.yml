name: RSS Feed Fetcher

on:
  schedule:
    - cron: '0 * * * *'   # Every hour

  workflow_dispatch:

jobs:
  fetch-rss:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      
      - name: Diagnose tokenizer failure
        run: |
          python --version
          python -m pip show spacy
          python -m pip show en-core-web-sm
          python -m pip show numpy
          python -m pip show thinc
          python -m pip show srsly

          echo "TEST 1: Basic English tokenizer"
          python -c "import spacy; nlp = spacy.blank('en'); print('Basic tokenizer works'); print('Rules:', len(nlp.tokenizer.rules))"

          echo "TEST 2: English model tokenizer"
          python -c "import spacy; nlp = spacy.blank('en'); import en_core_web_sm; print('Model package:', en_core_web_sm.__version__); print('Model path:', en_core_web_sm.__file__); nlp2 = spacy.load('en_core_web_sm', exclude=['tagger','parser','ner','attribute_ruler','lemmatizer','tok2vec']); print('Model tokenizer loaded'); print('Rules:', len(nlp2.tokenizer.rules))"

      - name: Run RSS Fetcher
        run: python fetch_rss.py

      - name: Run Google Trends
        run: python fetch_google_trends.py
