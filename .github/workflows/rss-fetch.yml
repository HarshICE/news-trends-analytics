name: RSS Feed Fetcher

on:
  schedule:
    - cron: '0 * * * *'   # Every hour

  workflow_dispatch:

jobs:
  fetch-rss:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.12"
            cache: pip

      - name: Install dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt
      
      - name: Diagnose spaCy installation
        run: |
            python --version
            python -m pip show spacy
            python -m pip show en-core-web-sm
            python -m pip check
            python -c "import spacy; import en_core_web_sm; print('spaCy:', spacy.__version__); print('Model:', en_core_web_sm.__version__); nlp = spacy.load('en_core_web_sm'); print('Model loaded successfully'); print([(e.text, e.label_) for e in nlp('Virat Kohli plays cricket for India.').ents])"

      - name: Run RSS Fetcher
        run: python fetch_rss.py

      - name: Run Google Trends
        run: python fetch_google_trends.py
